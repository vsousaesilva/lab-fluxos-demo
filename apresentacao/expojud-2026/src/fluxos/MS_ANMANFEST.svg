<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .lane{fill:#fcfcfc;stroke:#9a9a9a;stroke-width:1}.lanealt{fill:#f3f3f3;stroke:#9a9a9a;stroke-width:1}
      .lanelbl{font-size:12px;font-weight:600;fill:#333;letter-spacing:.1em}
      .task{fill:#fff;stroke:#333;stroke-width:1.6;rx:8}.auto{fill:#ededed;stroke:#555;stroke-width:1.2;rx:8}
      .gw{fill:#fff;stroke:#333;stroke-width:1.6}.ev{fill:#fff;stroke:#333}
      .tt{font-size:12px;fill:#111;font-weight:600}.ts{font-size:9.5px;fill:#555}
      .gl{font-size:10.5px;fill:#111;font-weight:600}.el{font-size:10px;fill:#333}
      .flow{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .bus{stroke:#333;stroke-width:1.4;fill:none}
      .note{font-size:10px;fill:#666;font-style:italic}
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="760" fill="#fff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#111">MS_ANMANFEST — [MS] Análise de manifestação</text>
  <text x="24" y="48" class="note">Caixa cinza = automático · caixa branca = tarefa humana</text>

  <rect class="lane" x="24" y="70" width="1552" height="200"/>
  <rect class="lanealt" x="24" y="270" width="1552" height="150"/>
  <rect class="lane" x="24" y="420" width="1552" height="250"/>
  <rect class="lanealt" x="24" y="70" width="34" height="200"/><rect class="lane" x="24" y="270" width="34" height="150"/><rect class="lanealt" x="24" y="420" width="34" height="250"/>
  <text class="lanelbl" transform="translate(46,215) rotate(-90)">SECRETARIA</text>
  <text class="lanelbl" transform="translate(46,370) rotate(-90)">SISTEMA</text>
  <text class="lanelbl" transform="translate(46,585) rotate(-90)">ENCAMINHAMENTOS</text>

  <!-- SECRETARIA -->
  <rect class="task" x="620" y="95" width="220" height="66"/>
  <text x="730" y="122" class="tt" text-anchor="middle">[MS] Expediente —</text>
  <text x="730" y="138" class="tt" text-anchor="middle">Com manifestação</text>
  <text x="730" y="154" class="ts" text-anchor="middle">houve juntada de parte no período</text>

  <rect class="task" x="620" y="185" width="220" height="66"/>
  <text x="730" y="212" class="tt" text-anchor="middle">[MS] Expediente —</text>
  <text x="730" y="228" class="tt" text-anchor="middle">Sem manifestação</text>
  <text x="730" y="244" class="ts" text-anchor="middle">prazo decorreu sem juntada</text>

  <!-- SISTEMA -->
  <circle class="ev" cx="110" cy="345" r="16" stroke-width="1.8"/>
  <text x="110" y="380" class="ts" text-anchor="middle">Início</text>

  <path class="gw" d="M320,301 L365,345 L320,389 L275,345 z"/>
  <rect x="150" y="410" width="330" height="14" fill="#fff"/>
  <text x="152" y="421" class="el">documento juntado por parte no período, com origem não interna</text>
  <rect x="372" y="331" width="150" height="26" fill="#fff"/>
  <text x="375" y="341" class="gl">Expediente com</text>
  <text x="375" y="354" class="gl">manifestação aberto?</text>

  <!-- ENCAMINHAMENTOS -->
  <rect class="auto" x="90" y="530" width="175" height="55"/>
  <text x="177" y="555" class="tt" text-anchor="middle">Intimar MPF</text>
  <text x="177" y="571" class="ts" text-anchor="middle">MS_INTMPF · 10 dias</text>

  <rect class="auto" x="290" y="530" width="185" height="55"/>
  <text x="382" y="549" class="tt" text-anchor="middle">Intimar impetrante</text>
  <text x="382" y="564" class="ts" text-anchor="middle">MS_INTIMPRET</text>
  <text x="382" y="577" class="ts" text-anchor="middle">perda do objeto</text>

  <rect class="auto" x="500" y="530" width="175" height="55"/>
  <text x="587" y="555" class="tt" text-anchor="middle">Controle de prazo</text>
  <text x="587" y="571" class="ts" text-anchor="middle">MS_CONTRPRAZ</text>

  <rect class="auto" x="700" y="530" width="175" height="55"/>
  <text x="787" y="555" class="tt" text-anchor="middle">Elaborar comunicação</text>
  <text x="787" y="571" class="ts" text-anchor="middle">ELCOM</text>

  <rect class="auto" x="900" y="530" width="230" height="55"/>
  <text x="1015" y="549" class="tt" text-anchor="middle">Conclusão para decisão,</text>
  <text x="1015" y="564" class="tt" text-anchor="middle">despacho ou julgamento</text>
  <text x="1015" y="577" class="ts" text-anchor="middle">ELDEC · ELDECURG · ELDESP · ELSENT</text>

  <rect class="auto" x="1155" y="530" width="175" height="55"/>
  <text x="1242" y="555" class="tt" text-anchor="middle">Análise de secretaria</text>
  <text x="1242" y="571" class="ts" text-anchor="middle">ANSEC</text>

  <rect class="task" x="1355" y="530" width="160" height="55"/>
  <text x="1435" y="555" class="tt" text-anchor="middle">Nó de Desvio</text>
  <text x="1435" y="571" class="ts" text-anchor="middle">reposicionamento</text>

  <circle class="ev" cx="1540" cy="700" r="16" stroke-width="3.4"/>
  <text x="1540" y="734" class="ts" text-anchor="middle">Término</text>

  <!-- FLUXOS -->
  <path class="flow" d="M126,345 L275,345"/>
  <path class="flow" d="M320,301 L320,128 L620,128"/>
  <rect x="330" y="196" width="30" height="14" fill="#fff"/>
  <text x="333" y="207" class="el">SIM</text>
  <path class="flow" d="M365,345 L520,345 L520,218 L620,218"/>
  <rect x="440" y="262" width="34" height="14" fill="#fff"/>
  <text x="443" y="273" class="el">NÃO</text>

  <path class="bus" d="M730,161 L730,175 M730,251 L730,290 M760,161 L760,290"/>
  <path class="bus" d="M730,290 L730,485 M177,485 L1435,485"/>
  <rect x="836" y="468" width="382" height="14" fill="#fff"/>
  <text x="839" y="479" class="el">as duas tarefas oferecem os mesmos encaminhamentos, salvo os marcados</text>

  <path class="flow" d="M177,485 L177,530"/>
  <path class="flow" d="M382,485 L382,530"/>
  <path class="flow" d="M587,485 L587,530"/>
  <path class="flow" d="M787,485 L787,530"/>
  <path class="flow" d="M1015,485 L1015,530"/>
  <path class="flow" d="M1242,485 L1242,530"/>
  <path class="flow" d="M1435,485 L1435,530"/>

  <rect x="300" y="504" width="152" height="14" fill="#fff"/>
  <text x="303" y="515" class="el">só de Com manifestação</text>
  <rect x="700" y="504" width="152" height="14" fill="#fff"/>
  <text x="703" y="515" class="el">só de Com manifestação</text>
  <rect x="500" y="504" width="148" height="14" fill="#fff"/>
  <text x="503" y="515" class="el">só de Sem manifestação</text>

  <path class="bus" d="M177,585 L177,640 M177,640 L1435,640 M382,585 L382,640 M587,585 L587,640 M787,585 L787,640 M1015,585 L1015,640 M1242,585 L1242,640 M1435,585 L1435,640"/>
  <path class="flow" d="M1435,640 L1540,640 L1540,684"/>

  <text x="24" y="712" class="note">Fonte: MS_ANMANFEST.xml · revisão de 10/09/2026. A conclusão para julgamento lança o movimento 51 antes de encaminhar ao ELSENT.</text>
  <text x="24" y="730" class="note">O XML mantém um nó órfão "Enviar para Minutar sentença", sem transição de entrada — não desenhado por não integrar o fluxo.</text>
</svg>
