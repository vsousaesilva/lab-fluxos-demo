<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 920" width="1780" height="920" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .lane{fill:#fcfcfc;stroke:#9a9a9a;stroke-width:1}.lanealt{fill:#f3f3f3;stroke:#9a9a9a;stroke-width:1}
      .lanelbl{font-size:12px;font-weight:600;fill:#333;letter-spacing:.1em}
      .task{fill:#fff;stroke:#333;stroke-width:1.6;rx:8}.auto{fill:#ededed;stroke:#555;stroke-width:1.2;rx:8}
      .gw{fill:#fff;stroke:#333;stroke-width:1.6}.ev{fill:#fff;stroke:#333}
      .link{fill:#fff;stroke:#333;stroke-width:1.6;stroke-dasharray:5 3;rx:8}
      .tt{font-size:12px;fill:#111;font-weight:600}.ts{font-size:9.5px;fill:#555}
      .gl{font-size:10.5px;fill:#111;font-weight:600}.el{font-size:10px;fill:#333}
      .flow{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .note{font-size:10px;fill:#666;font-style:italic}
    </style>
  </defs>
  <rect x="0" y="0" width="1780" height="920" fill="#fff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#111">MS_CONTRPRAZREC · 2 de 2 — Roteamento recursal</text>
  <text x="24" y="48" class="note">Avaliado quando todos os expedientes do prazo recursal estão fechados · precedência de cima para baixo</text>

  <rect class="lane" x="24" y="70" width="1732" height="230"/>
  <rect class="lanealt" x="24" y="300" width="1732" height="330"/>
  <rect class="lane" x="24" y="630" width="1732" height="230"/>
  <rect class="lanealt" x="24" y="70" width="34" height="230"/><rect class="lane" x="24" y="300" width="34" height="330"/><rect class="lanealt" x="24" y="630" width="34" height="230"/>
  <text class="lanelbl" transform="translate(46,225) rotate(-90)">SECRETARIA</text>
  <text class="lanelbl" transform="translate(46,500) rotate(-90)">SISTEMA</text>
  <text class="lanelbl" transform="translate(46,780) rotate(-90)">DESTINOS</text>

  <!-- SISTEMA · cadeia de decisões -->
  <rect class="link" x="80" y="430" width="180" height="60"/>
  <text x="170" y="455" class="tt" text-anchor="middle">Prazo encerrado</text>
  <text x="170" y="471" class="ts" text-anchor="middle">vem do desenho 1 de 2</text>

  <path class="gw" d="M370,416 L415,460 L370,504 L325,460 z"/>
  <rect x="300" y="516" width="150" height="26" fill="#fff"/>
  <text x="303" y="526" class="gl">Ciclo posterior</text>
  <text x="303" y="539" class="gl">a embargos?</text>

  <path class="gw" d="M600,416 L645,460 L600,504 L555,460 z"/>
  <rect x="530" y="516" width="150" height="26" fill="#fff"/>
  <text x="533" y="526" class="gl">Tem embargos</text>
  <text x="533" y="539" class="gl">de declaração?</text>

  <path class="gw" d="M830,416 L875,460 L830,504 L785,460 z"/>
  <rect x="790" y="516" width="110" height="14" fill="#fff"/>
  <text x="793" y="526" class="gl">Tem apelação?</text>

  <path class="gw" d="M1060,416 L1105,460 L1060,504 L1015,460 z"/>
  <rect x="1000" y="516" width="140" height="26" fill="#fff"/>
  <text x="1003" y="526" class="gl">Tem outra</text>
  <text x="1003" y="539" class="gl">manifestação?</text>

  <path class="gw" d="M1300,416 L1345,460 L1300,504 L1255,460 z"/>
  <rect x="1250" y="516" width="140" height="26" fill="#fff"/>
  <text x="1253" y="526" class="gl">Tipo da</text>
  <text x="1253" y="539" class="gl">sentença?</text>

  <!-- SISTEMA · ramo apelação -->
  <rect class="auto" x="760" y="330" width="180" height="62"/>
  <text x="850" y="353" class="tt" text-anchor="middle">Identificar polo</text>
  <text x="850" y="369" class="tt" text-anchor="middle">que apelou</text>
  <text x="850" y="383" class="ts" text-anchor="middle">define polos e intimação do MPF</text>

  <rect class="auto" x="760" y="590" width="180" height="0"/>

  <!-- SECRETARIA -->
  <rect class="task" x="330" y="100" width="230" height="82"/>
  <text x="445" y="126" class="tt" text-anchor="middle">[MS] Recursos — Analisar</text>
  <text x="445" y="142" class="tt" text-anchor="middle">após julgamento dos embargos</text>
  <text x="445" y="159" class="ts" text-anchor="middle">informa se havia apelação no prazo anterior</text>
  <text x="445" y="172" class="ts" text-anchor="middle">encaminhamento é decisão do servidor</text>

  <rect class="task" x="1020" y="100" width="220" height="82"/>
  <text x="1130" y="126" class="tt" text-anchor="middle">[MS] Expediente de recurso</text>
  <text x="1130" y="142" class="tt" text-anchor="middle">— Com manifestação</text>
  <text x="1130" y="159" class="ts" text-anchor="middle">juntada que não é apelação</text>
  <text x="1130" y="172" class="ts" text-anchor="middle">nem embargos · analisar antes</text>

  <rect class="task" x="1300" y="100" width="230" height="82"/>
  <text x="1415" y="126" class="tt" text-anchor="middle">[MS] Expediente de recurso —</text>
  <text x="1415" y="142" class="tt" text-anchor="middle">Tipo de sentença não identificado</text>
  <text x="1415" y="159" class="ts" text-anchor="middle">nenhum movimento de concessão,</text>
  <text x="1415" y="172" class="ts" text-anchor="middle">denegação ou extinção</text>

  <rect class="task" x="620" y="210" width="230" height="76"/>
  <text x="735" y="236" class="tt" text-anchor="middle">[MS] Controle de prazo para</text>
  <text x="735" y="252" class="tt" text-anchor="middle">contrarrazões — em curso</text>
  <text x="735" y="269" class="ts" text-anchor="middle">15 dias · registro de ciência</text>

  <!-- DESTINOS -->
  <rect class="auto" x="120" y="700" width="220" height="62"/>
  <text x="230" y="725" class="tt" text-anchor="middle">Contrarrazões dos embargos</text>
  <text x="230" y="741" class="ts" text-anchor="middle">MS_CONTRPRAZCONTREMB</text>
  <text x="230" y="754" class="ts" text-anchor="middle">5 dias</text>

  <rect class="auto" x="400" y="700" width="200" height="62"/>
  <text x="500" y="732" class="tt" text-anchor="middle">Remessa ao TRF5</text>
  <text x="500" y="748" class="ts" text-anchor="middle">REMTRF5</text>

  <rect class="auto" x="660" y="700" width="230" height="62"/>
  <text x="775" y="725" class="tt" text-anchor="middle">Etiqueta [A] Remessa</text>
  <text x="775" y="741" class="tt" text-anchor="middle">necessária → REMTRF5</text>
  <text x="775" y="754" class="ts" text-anchor="middle">sentença concessiva</text>

  <rect class="auto" x="950" y="700" width="230" height="62"/>
  <text x="1065" y="725" class="tt" text-anchor="middle">Certificação do trânsito</text>
  <text x="1065" y="741" class="ts" text-anchor="middle">CERTTRANSJULG</text>
  <text x="1065" y="754" class="ts" text-anchor="middle">denegatória ou extinção sem mérito</text>

  <rect class="auto" x="1240" y="700" width="180" height="62"/>
  <text x="1330" y="732" class="tt" text-anchor="middle">Análise de secretaria</text>
  <text x="1330" y="748" class="ts" text-anchor="middle">ANSEC</text>

  <rect class="task" x="1480" y="700" width="170" height="62"/>
  <text x="1565" y="732" class="tt" text-anchor="middle">Nó de Desvio</text>
  <text x="1565" y="748" class="ts" text-anchor="middle">reposicionamento</text>

  <!-- FLUXOS · cadeia -->
  <path class="flow" d="M260,460 L325,460"/>
  <path class="flow" d="M415,460 L555,460"/>
  <rect x="440" y="443" width="34" height="14" fill="#fff"/>
  <text x="443" y="454" class="el">NÃO</text>
  <path class="flow" d="M645,460 L785,460"/>
  <rect x="672" y="443" width="34" height="14" fill="#fff"/>
  <text x="675" y="454" class="el">NÃO</text>
  <path class="flow" d="M875,460 L1015,460"/>
  <rect x="902" y="443" width="34" height="14" fill="#fff"/>
  <text x="905" y="454" class="el">NÃO</text>
  <path class="flow" d="M1105,460 L1255,460"/>
  <rect x="1136" y="443" width="34" height="14" fill="#fff"/>
  <text x="1139" y="454" class="el">NÃO</text>

  <!-- ramificações -->
  <path class="flow" d="M370,416 L370,182"/>
  <rect x="376" y="292" width="30" height="14" fill="#fff"/>
  <text x="379" y="303" class="el">SIM</text>

  <path class="flow" d="M600,416 L600,380 L230,380 L230,700"/>
  <rect x="330" y="364" width="30" height="14" fill="#fff"/>
  <text x="333" y="375" class="el">SIM</text>
  <rect x="236" y="600" width="182" height="14" fill="#fff"/>
  <text x="239" y="611" class="el">registra apelação pendente antes</text>

  <path class="flow" d="M830,416 L830,392"/>
  <rect x="836" y="398" width="30" height="14" fill="#fff"/>
  <text x="839" y="409" class="el">SIM</text>
  <path class="flow" d="M850,330 L850,300 L735,300 L735,286"/>
  <rect x="742" y="308" width="196" height="14" fill="#fff"/>
  <text x="745" y="319" class="el">intimar contrarrazões · CP_INTAUT · 15 dias</text>

  <path class="flow" d="M620,248 L500,248 L500,700"/>
  <rect x="506" y="600" width="196" height="14" fill="#fff"/>
  <text x="509" y="611" class="el">contrarrazões juntadas ou prazo decorrido</text>

  <path class="flow" d="M1060,416 L1060,182"/>
  <rect x="1066" y="292" width="30" height="14" fill="#fff"/>
  <text x="1069" y="303" class="el">SIM</text>

  <path class="flow" d="M1300,416 L1300,182"/>
  <rect x="1306" y="292" width="72" height="14" fill="#fff"/>
  <text x="1309" y="303" class="el">indefinido</text>

  <path class="flow" d="M1300,504 L1300,560 L775,560 L775,700"/>
  <rect x="880" y="544" width="76" height="14" fill="#fff"/>
  <text x="883" y="555" class="el">concessiva</text>

  <path class="flow" d="M1345,460 L1420,460 L1420,580 L1065,580 L1065,700"/>
  <rect x="1100" y="564" width="216" height="14" fill="#fff"/>
  <text x="1103" y="575" class="el">denegatória ou extinção sem resolução do mérito</text>

  <!-- saídas das tarefas humanas -->
  <path class="flow" d="M445,182 L445,660 L1330,660 L1330,700"/>
  <rect x="900" y="644" width="256" height="14" fill="#fff"/>
  <text x="903" y="655" class="el">as tarefas humanas oferecem todos os destinos acima</text>

  <path class="flow" d="M1530,140 L1565,140 L1565,700"/>
  <rect x="1571" y="400" width="42" height="14" fill="#fff"/>
  <text x="1574" y="411" class="el">desvio</text>

  <text x="24" y="890" class="note">Fonte: MS_CONTRPRAZREC.xml · revisão de 10/09/2026. O ramo da apelação passa por tarefa de pendência de intimação quando alguma parte não puder ser intimada automaticamente — omitida aqui, idêntica à dos demais fluxos.</text>
</svg>
