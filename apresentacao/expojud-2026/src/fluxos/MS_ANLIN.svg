<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 780" width="1500" height="780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .lane{fill:#fcfcfc;stroke:#9a9a9a;stroke-width:1}.lanealt{fill:#f3f3f3;stroke:#9a9a9a;stroke-width:1}
      .lanelbl{font-size:12px;font-weight:600;fill:#333;letter-spacing:.1em}
      .task{fill:#fff;stroke:#333;stroke-width:1.6;rx:8}.auto{fill:#ededed;stroke:#555;stroke-width:1.2;rx:8}
      .gw{fill:#fff;stroke:#333;stroke-width:1.6}.ev{fill:#fff;stroke:#333}
      .tt{font-size:12px;fill:#111;font-weight:600}.ts{font-size:9.5px;fill:#555}
      .gl{font-size:10.5px;fill:#111;font-weight:600}.el{font-size:10px;fill:#333}
      .flow{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .bus{stroke:#333;stroke-width:1.4;fill:none}
      .note{font-size:10px;fill:#666;font-style:italic}
    </style>
  </defs>
  <rect x="0" y="0" width="1500" height="780" fill="#fff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#111">MS_ANLIN — [MS] Analisar Inicial</text>
  <text x="24" y="48" class="note">Caixa cinza = automático · caixa branca = tarefa humana</text>

  <rect class="lane" x="24" y="70" width="1452" height="200"/>
  <rect class="lanealt" x="24" y="270" width="1452" height="170"/>
  <rect class="lane" x="24" y="440" width="1452" height="250"/>
  <rect class="lanealt" x="24" y="70" width="34" height="200"/><rect class="lane" x="24" y="270" width="34" height="170"/><rect class="lanealt" x="24" y="440" width="34" height="250"/>
  <text class="lanelbl" transform="translate(46,215) rotate(-90)">SECRETARIA</text>
  <text class="lanelbl" transform="translate(46,380) rotate(-90)">SISTEMA</text>
  <text class="lanelbl" transform="translate(46,600) rotate(-90)">ENCAMINHAMENTOS</text>

  <!-- SECRETARIA -->
  <rect class="task" x="620" y="95" width="210" height="62"/>
  <text x="725" y="120" class="tt" text-anchor="middle">[MS] - Analisar Inicial</text>
  <text x="725" y="137" class="ts" text-anchor="middle">avisos de tutela e de documentação da parte</text>

  <rect class="task" x="620" y="185" width="210" height="62"/>
  <text x="725" y="210" class="tt" text-anchor="middle">[MS] - Analisar Inicial urgente</text>
  <text x="725" y="227" class="ts" text-anchor="middle">liminar pendente de apreciação</text>

  <rect class="auto" x="920" y="185" width="180" height="62"/>
  <text x="1010" y="211" class="tt" text-anchor="middle">Minutar decisão</text>
  <text x="1010" y="228" class="ts" text-anchor="middle">ELDECURG · urgente</text>

  <!-- SISTEMA -->
  <circle class="ev" cx="110" cy="355" r="16" stroke-width="1.8"/>
  <text x="110" y="390" class="ts" text-anchor="middle">Início</text>

  <rect class="auto" x="160" y="324" width="200" height="62"/>
  <text x="260" y="349" class="tt" text-anchor="middle">Vincular etiqueta</text>
  <text x="260" y="366" class="ts" text-anchor="middle">[A] Mandado de segurança</text>

  <path class="gw" d="M460,311 L505,355 L460,399 L415,355 z"/>
  <rect x="512" y="341" width="128" height="26" fill="#fff"/>
  <text x="515" y="351" class="gl">Pedido de liminar</text>
  <text x="515" y="364" class="gl">não apreciado?</text>

  <!-- ENCAMINHAMENTOS -->
  <rect class="auto" x="90" y="545" width="185" height="55"/>
  <text x="182" y="570" class="tt" text-anchor="middle">Notificar impetrado</text>
  <text x="182" y="586" class="ts" text-anchor="middle">MS_INTAUTIMPET</text>

  <rect class="auto" x="305" y="545" width="150" height="55"/>
  <text x="380" y="570" class="tt" text-anchor="middle">Minutar sentença</text>
  <text x="380" y="586" class="ts" text-anchor="middle">ELSENT</text>

  <rect class="auto" x="485" y="545" width="150" height="55"/>
  <text x="560" y="570" class="tt" text-anchor="middle">Minutar decisão</text>
  <text x="560" y="586" class="ts" text-anchor="middle">ELDEC</text>

  <rect class="auto" x="665" y="545" width="150" height="55"/>
  <text x="740" y="570" class="tt" text-anchor="middle">Minutar despacho</text>
  <text x="740" y="586" class="ts" text-anchor="middle">ELDESP</text>

  <rect class="auto" x="845" y="545" width="165" height="55"/>
  <text x="927" y="570" class="tt" text-anchor="middle">Análise de secretaria</text>
  <text x="927" y="586" class="ts" text-anchor="middle">ANSEC</text>

  <rect class="task" x="1040" y="545" width="160" height="55"/>
  <text x="1120" y="570" class="tt" text-anchor="middle">Nó de Desvio</text>
  <text x="1120" y="586" class="ts" text-anchor="middle">reposicionamento</text>

  <circle class="ev" cx="1400" cy="572" r="16" stroke-width="3.4"/>
  <text x="1400" y="606" class="ts" text-anchor="middle">Término</text>

  <!-- FLUXOS -->
  <path class="flow" d="M126,355 L160,355"/>
  <path class="flow" d="M360,355 L415,355"/>

  <path class="flow" d="M460,311 L460,126 L620,126"/>
  <rect x="466" y="176" width="34" height="14" fill="#fff"/>
  <text x="469" y="187" class="el">NÃO</text>

  <path class="flow" d="M505,355 L560,355 L560,216 L620,216"/>
  <rect x="566" y="264" width="30" height="14" fill="#fff"/>
  <text x="569" y="275" class="el">SIM</text>

  <path class="flow" d="M830,216 L920,216"/>

  <path class="bus" d="M725,157 L725,175"/>
  <path class="bus" d="M760,247 L760,290 L725,290"/>
  <path class="bus" d="M725,175 L725,490 M182,490 L1120,490"/>
  <rect x="826" y="473" width="274" height="14" fill="#fff"/>
  <text x="829" y="484" class="el">as duas tarefas oferecem os mesmos encaminhamentos</text>

  <path class="flow" d="M182,490 L182,545"/>
  <path class="flow" d="M380,490 L380,545"/>
  <path class="flow" d="M560,490 L560,545"/>
  <path class="flow" d="M740,490 L740,545"/>
  <path class="flow" d="M927,490 L927,545"/>
  <path class="flow" d="M1120,490 L1120,545"/>

  <path class="bus" d="M182,600 L182,645 M182,645 L1120,645"/>
  <path class="bus" d="M380,600 L380,645 M560,600 L560,645 M740,600 L740,645 M927,600 L927,645 M1120,600 L1120,645"/>
  <path class="flow" d="M1120,645 L1400,645 L1400,588"/>

  <text x="24" y="730" class="note">Fonte: MS_ANLIN.xml · revisão de 10/09/2026. A tarefa urgente acrescenta o encaminhamento a ELDECURG; os demais são comuns às duas.</text>
  <text x="24" y="748" class="note">O Nó de Desvio também devolve o processo às duas tarefas de análise — retorno não desenhado para não poluir.</text>
</svg>
