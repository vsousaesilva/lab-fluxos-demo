<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" width="1500" height="620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .lane{fill:#fcfcfc;stroke:#9a9a9a;stroke-width:1}.lanealt{fill:#f3f3f3;stroke:#9a9a9a;stroke-width:1}
      .lanelbl{font-size:12px;font-weight:600;fill:#333;letter-spacing:.1em}
      .task{fill:#fff;stroke:#333;stroke-width:1.6;rx:8}.auto{fill:#ededed;stroke:#555;stroke-width:1.2;rx:8}
      .gw{fill:#fff;stroke:#333;stroke-width:1.6}.ev{fill:#fff;stroke:#333}
      .link{fill:#fff;stroke:#333;stroke-width:1.6;stroke-dasharray:5 3;rx:8}
      .tt{font-size:12px;fill:#111;font-weight:600}.ts{font-size:9.5px;fill:#555}
      .gl{font-size:10.5px;fill:#111;font-weight:600}.el{font-size:10px;fill:#333}
      .flow{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .note{font-size:10px;fill:#666;font-style:italic}
    </style>
  </defs>
  <rect x="0" y="0" width="1500" height="620" fill="#fff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#111">CONTRPRAZ — recorte alterado para o Mandado de Segurança</text>
  <text x="24" y="48" class="note">Dois pontos de teste de classe: um na entrada, acrescentado agora, e outro na saída, que já existia</text>

  <rect class="lane" x="24" y="70" width="1452" height="150"/>
  <rect class="lanealt" x="24" y="220" width="1452" height="220"/>
  <rect class="lane" x="24" y="440" width="1452" height="130"/>
  <rect class="lanealt" x="24" y="70" width="34" height="150"/><rect class="lane" x="24" y="220" width="34" height="220"/><rect class="lanealt" x="24" y="440" width="34" height="130"/>
  <text class="lanelbl" transform="translate(46,190) rotate(-90)">SECRETARIA</text>
  <text class="lanelbl" transform="translate(46,360) rotate(-90)">SISTEMA</text>
  <text class="lanelbl" transform="translate(46,530) rotate(-90)">DESTINOS</text>

  <!-- SECRETARIA -->
  <rect class="task" x="720" y="100" width="220" height="76"/>
  <text x="830" y="126" class="tt" text-anchor="middle">Controle de prazo</text>
  <text x="830" y="142" class="tt" text-anchor="middle">— Em curso</text>
  <text x="830" y="159" class="ts" text-anchor="middle">registro de ciência · encerrar expedientes</text>
  <text x="830" y="171" class="ts" text-anchor="middle">demais classes seguem inalteradas</text>

  <!-- SISTEMA -->
  <circle class="ev" cx="105" cy="330" r="16" stroke-width="1.8"/>
  <text x="105" y="365" class="ts" text-anchor="middle">Início</text>

  <path class="gw" d="M260,286 L305,330 L260,374 L215,330 z"/>
  <rect x="150" y="392" width="220" height="26" fill="#fff"/>
  <text x="153" y="402" class="gl">É Mandado de segurança?</text>
  <text x="153" y="415" class="ts">acrescentado · classes 119 e 120</text>

  <rect class="auto" x="430" y="299" width="180" height="62"/>
  <text x="520" y="322" class="tt" text-anchor="middle">Registrar entrada</text>
  <text x="520" y="338" class="ts" text-anchor="middle">grava o marco temporal</text>
  <text x="520" y="351" class="ts" text-anchor="middle">fluxo:dataEntradaControlarPrazo</text>

  <rect class="auto" x="670" y="299" width="200" height="62"/>
  <text x="770" y="325" class="tt" text-anchor="middle">Controle dos expedientes</text>
  <text x="770" y="341" class="ts" text-anchor="middle">grava e atualiza a lista</text>
  <text x="770" y="354" class="ts" text-anchor="middle">demais nós não alterados</text>

  <path class="gw" d="M1080,286 L1125,330 L1080,374 L1035,330 z"/>
  <rect x="1132" y="316" width="230" height="26" fill="#fff"/>
  <text x="1135" y="326" class="gl">Tem classe de Mandado</text>
  <text x="1135" y="339" class="gl">de segurança?</text>

  <!-- DESTINOS -->
  <rect class="auto" x="180" y="485" width="230" height="62"/>
  <text x="295" y="510" class="tt" text-anchor="middle">Controle de prazo do MS</text>
  <text x="295" y="526" class="ts" text-anchor="middle">MS_CONTRPRAZ</text>
  <text x="295" y="539" class="ts" text-anchor="middle">saída acrescentada</text>

  <rect class="auto" x="1060" y="485" width="230" height="62"/>
  <text x="1175" y="510" class="tt" text-anchor="middle">Análise de manifestação</text>
  <text x="1175" y="526" class="ts" text-anchor="middle">MS_ANMANFEST</text>
  <text x="1175" y="539" class="ts" text-anchor="middle">saída que já existia</text>

  <rect class="link" x="800" y="485" width="200" height="62"/>
  <text x="900" y="516" class="tt" text-anchor="middle">Demais destinos</text>
  <text x="900" y="532" class="ts" text-anchor="middle">inalterados</text>

  <!-- FLUXOS -->
  <path class="flow" d="M121,330 L215,330"/>
  <path class="flow" d="M305,330 L430,330"/>
  <rect x="330" y="313" width="34" height="14" fill="#fff"/>
  <text x="333" y="324" class="el">NÃO</text>

  <path class="flow" d="M260,374 L260,485"/>
  <rect x="266" y="430" width="30" height="14" fill="#fff"/>
  <text x="269" y="441" class="el">SIM</text>

  <path class="flow" d="M610,330 L670,330"/>
  <path class="flow" d="M870,330 L1035,330"/>
  <rect x="890" y="313" width="130" height="14" fill="#fff"/>
  <text x="893" y="324" class="el">expedientes fecharam</text>

  <path class="flow" d="M770,299 L770,230 L830,230 L830,176"/>
  <path class="flow" d="M900,176 L900,250 L1080,250 L1080,286"/>
  <rect x="930" y="234" width="130" height="14" fill="#fff"/>
  <text x="933" y="245" class="el">prazo encerrado</text>

  <path class="flow" d="M1080,374 L1080,450 L1175,450 L1175,485"/>
  <rect x="1090" y="434" width="30" height="14" fill="#fff"/>
  <text x="1093" y="445" class="el">SIM</text>

  <path class="flow" d="M1125,330 L1400,330 L1400,460 L900,460 L900,485"/>
  <rect x="1240" y="444" width="34" height="14" fill="#fff"/>
  <text x="1243" y="455" class="el">NÃO</text>

  <text x="24" y="596" class="note">Fonte: CONTRPRAZ.xml · revisão de 10/09/2026. O teste na entrada evita que o processo de MS permaneça no trilho geral quando chega por ELDEC, ELDECURG, ELDESP, ELCOM, ANSEC ou CONTRDEVEXP.</text>
</svg>
