<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 720" width="1800" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .lane{fill:#fcfcfc;stroke:#9a9a9a;stroke-width:1}.lanealt{fill:#f3f3f3;stroke:#9a9a9a;stroke-width:1}
      .lanelbl{font-size:12px;font-weight:600;fill:#333;letter-spacing:.1em}
      .task{fill:#fff;stroke:#333;stroke-width:1.6;rx:8}.sub{fill:#fff;stroke:#333;stroke-width:3;rx:8}
      .auto{fill:#ededed;stroke:#555;stroke-width:1.2;rx:8}
      .gw{fill:#fff;stroke:#333;stroke-width:1.6}.ev{fill:#fff;stroke:#333}
      .tt{font-size:12px;fill:#111;font-weight:600}.ts{font-size:9.5px;fill:#555}
      .gl{font-size:10.5px;fill:#111;font-weight:600}.el{font-size:10px;fill:#333}
      .flow{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .note{font-size:10px;fill:#666;font-style:italic}
    </style>
  </defs>
  <rect x="0" y="0" width="1800" height="720" fill="#fff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#111">MS_CONTRPRAZCONTREMB — [MS] Contrarrazões aos embargos de declaração</text>
  <text x="24" y="48" class="note">Contorno grosso = subprocesso · caixa cinza = automático · caixa branca = tarefa humana</text>

  <rect class="lane" x="24" y="70" width="1752" height="190"/>
  <rect class="lanealt" x="24" y="260" width="1752" height="240"/>
  <rect class="lane" x="24" y="500" width="1752" height="160"/>
  <rect class="lanealt" x="24" y="70" width="34" height="190"/><rect class="lane" x="24" y="260" width="34" height="240"/><rect class="lanealt" x="24" y="500" width="34" height="160"/>
  <text class="lanelbl" transform="translate(46,210) rotate(-90)">SECRETARIA</text>
  <text class="lanelbl" transform="translate(46,415) rotate(-90)">SISTEMA</text>
  <text class="lanelbl" transform="translate(46,610) rotate(-90)">SAÍDAS</text>

  <!-- SECRETARIA -->
  <rect class="task" x="360" y="105" width="200" height="70"/>
  <text x="460" y="131" class="tt" text-anchor="middle">[MS] Embargos — Analisar</text>
  <text x="460" y="147" class="tt" text-anchor="middle">pendência de intimação</text>
  <text x="460" y="164" class="ts" text-anchor="middle">miniPAC · 5 dias</text>

  <rect class="sub" x="700" y="105" width="200" height="70"/>
  <text x="800" y="133" class="tt" text-anchor="middle">Análise de comunicação</text>
  <text x="800" y="150" class="ts" text-anchor="middle">subprocesso ANCOM</text>
  <text x="800" y="164" class="ts" text-anchor="middle">despacha e devolve</text>

  <rect class="sub" x="990" y="105" width="200" height="70"/>
  <text x="1090" y="133" class="tt" text-anchor="middle">Controle de devolução</text>
  <text x="1090" y="150" class="ts" text-anchor="middle">subprocesso CONTRDEVEXP</text>
  <text x="1090" y="164" class="ts" text-anchor="middle">devolve ao fluxo</text>

  <rect class="task" x="1290" y="105" width="220" height="70"/>
  <text x="1400" y="131" class="tt" text-anchor="middle">[MS] Controle de prazo para</text>
  <text x="1400" y="147" class="tt" text-anchor="middle">contrarrazões — em curso</text>
  <text x="1400" y="164" class="ts" text-anchor="middle">registro de ciência · encerrar expedientes</text>

