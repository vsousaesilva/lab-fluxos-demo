  <text x="280" y="145.5" class="tt" text-anchor="middle">protocola a petição</text>
  <text x="280" y="161.5" class="ts" text-anchor="middle">tipo de documento 40 — proposta de acordo</text>
  <circle class="ev" data-name="INI" cx="280" cy="345" r="16" stroke-width="1.8"/>
  <text x="280" y="380" class="ts" text-anchor="middle">Início</text>
  <path class="gw" data-name="EXT" d="M430,301 L475,345 L430,389 L385,345 z"/>
  <rect x="372" y="400" width="110.4" height="28" fill="#fff"/>
  <text x="375" y="410" class="gl" text-anchor="start">Juntado por</text>
  <text x="375" y="423" class="gl" text-anchor="start">usuário externo?</text>
  <rect class="auto" data-name="SIG" x="530" y="314" width="210" height="62"/>
  <text x="635" y="336" class="tt" text-anchor="middle">Sinalizar juntada geral</text>
  <text x="635" y="352" class="ts" text-anchor="middle">sinal sjp:aguardaPeticao</text>
  <text x="635" y="365" class="ts" text-anchor="middle">acorda quem esperava petição</text>
  <path class="gw" data-name="LAUDO" d="M840,301 L885,345 L840,389 L795,345 z"/>
  <rect x="792" y="400" width="91.2" height="28" fill="#fff"/>
  <text x="795" y="410" class="gl" text-anchor="start">Juntado laudo</text>
  <text x="795" y="423" class="gl" text-anchor="start">pericial?</text>
  <rect class="auto" data-name="ENT" x="950" y="305" width="230" height="80"/>
  <text x="1065" y="336" class="tt" text-anchor="middle">Proposta de Acordo?</text>
  <text x="1065" y="352" class="ts" text-anchor="middle">se o tipo do documento = 40</text>
  <text x="1065" y="365" class="ts" text-anchor="middle">incluirNovoFluxo</text>
  <circle class="ev" data-name="FIM" cx="1310" cy="345" r="16" stroke-width="3.4"/>
  <text x="1310" y="380" class="ts" text-anchor="middle">Término</text>
  <rect class="link" data-name="INTERNO" x="330" y="530" width="190" height="62"/>
  <text x="425" y="558.5" class="tt" text-anchor="middle">Origem interna</text>
  <text x="425" y="574.5" class="ts" text-anchor="middle">não cria o fluxo de acordo</text>
  <rect class="link" data-name="ESPERA" x="545" y="530" width="200" height="62"/>
  <text x="645" y="558.5" class="tt" text-anchor="middle">Fluxos que esperavam</text>
  <text x="645" y="574.5" class="ts" text-anchor="middle">petição são acordados</text>
  <rect class="link" data-name="LAUDOD" x="770" y="530" width="170" height="62"/>
  <text x="855" y="558.5" class="tt" text-anchor="middle">Ramo do laudo</text>
  <text x="855" y="574.5" class="ts" text-anchor="middle">pericial</text>
  <rect class="sub" data-name="ACORDO" x="990" y="525" width="250" height="72"/>
  <text x="1115" y="552" class="tt" text-anchor="middle">Fluxo de proposta de acordo</text>
  <text x="1115" y="568" class="ts" text-anchor="middle">JFCE_FLUXO_ACORDO</text>
