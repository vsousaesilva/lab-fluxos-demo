<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 700" width="1480" height="700" font-family="Segoe UI, Arial, sans-serif">
  <text x="24" y="30" font-size="16" font-weight="700" fill="#111">SJP — Sinalizar Juntada de Petição (trecho do acordo)</text>
  <text x="24" y="48" class="note">Fluxo de serviço disparado em toda juntada · só o trecho que leva à proposta de acordo</text>
  <rect class="lane" x="24" y="70" width="1432" height="150"/>
  <rect class="lanealt" x="24" y="220" width="1432" height="250"/>
  <rect class="lane" x="24" y="470" width="1432" height="180"/>
  <rect class="lanealt" x="24" y="70" width="34" height="150"/>
