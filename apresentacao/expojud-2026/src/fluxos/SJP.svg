  <rect x="433" y="459" width="80.8" height="14" fill="#fff"/>
  <text x="436" y="470" class="el">NÃO · interno</text>
  <path class="flow" data-name="f_laudo" d="M740,345 L795,345"/>
  <path class="flow" data-name="f_laudosim" d="M840,389 L840,530"/>
  <rect x="843" y="459" width="24.8" height="14" fill="#fff"/>
  <text x="846" y="470" class="el">SIM</text>
  <path class="flow" data-name="f_ent" d="M885,345 L950,345"/>
  <rect x="893" y="327" width="24.8" height="14" fill="#fff"/>
  <text x="896" y="338" class="el">NÃO</text>
  <path class="flow" data-name="f_fim" d="M1180,345 L1294,345"/>
  <path class="par" data-name="p_sig" d="M635,376 L635,530"/>
  <rect x="638" y="444" width="176" height="14" fill="#fff"/>
  <text x="641" y="455" class="el">sinal genérico · antes de tudo</text>
  <path class="par" data-name="p_ent" d="M1065,385 L1065,525"/>
  <rect x="1068" y="444" width="120" height="14" fill="#fff"/>
  <text x="1071" y="455" class="el">cria o fluxo ao lado</text>
  <text x="24" y="686" class="note">Fonte: XMLs jPDL de fluxos-pje-ativos-2026-09-26. O sinal genérico sai antes da criação do fluxo de acordo.</text>
